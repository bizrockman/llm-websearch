use_default_settings: true

server:
  limiter: false
  secret_key: "orio-search-secret-change-me"

search:
  formats:
    - html
    - json

general:
  enable_metrics: false

# Keep in sync with the inline settings in docker-compose.coolify.yml.
# Rationale for each entry is documented there.
engines:
  # Blocked by fingerprinting (CAPTCHA, or Cloudflare 403 for yep).
  # brave stays enabled on purpose: it fails with a 429, which expires.
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: yep
    disabled: true

  - name: duckduckgo web
    disabled: false
  - name: bing
    disabled: false
  - name: seznam
    disabled: false
  - name: mwmbl
    disabled: false
