services:
  searxng:
    # Pinned to a specific tag — newer versions (2026.5.x and up) introduced
    # strict msgspec schema validation that breaks our minimal settings.yml.
    # Bump cautiously when upstream stabilizes the schema or when we update
    # settings.prod.yml to match the new requirements.
    image: searxng/searxng:2026.4.24-a7ac696b4
    restart: unless-stopped
    user: "0:0"
    # Settings are generated inline at startup. Coolify's bind-mount handling
    # for relative file paths in subdirs (./searxng/settings.prod.yml) is
    # unreliable — it creates an empty directory when the source can't be
    # resolved. Embedding the YAML in the entrypoint avoids that entirely.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cat > /etc/searxng/settings.yml <<EOF
        use_default_settings: true

        server:
          limiter: false
          secret_key: "$$SEARXNG_SECRET"
          public_instance: false

        search:
          formats:
            - html
            - json

        general:
          enable_metrics: false
        EOF
        chown searxng:searxng /etc/searxng/settings.yml
        exec /usr/local/searxng/entrypoint.sh
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
      - SEARXNG_BASE_URL=http://searxng:8080/
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      # Bind-mount to the extra Hetzner volume. Edit if your host uses a
      # different mount point. Coolify's compose parser does not reliably
      # substitute ${VAR} here, so the path is hardcoded.
      - /mnt/HC_Volume_105588883/orio/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 384M

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      # Bind-mount to the extra Hetzner volume. Edit if your host uses a
      # different mount point.
      - /mnt/HC_Volume_105588883/orio/meili:/meili_data
    expose:
      - "7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    image: ${ORIO_IMAGE:-ghcr.io/yourname/orio-search:latest}
    build: .
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_API_8000
      - ORIO_SEARCH_CONFIG=/app/config.yaml
      - ORIO_SEARXNG_URL=http://searxng:8080
      - ORIO_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ORIO_MEILI_URL=http://meilisearch:7700
      - ORIO_MEILI_API_KEY=${MEILI_MASTER_KEY}
      - ORIO_MEILI_ENABLED=true
      - ORIO_AUTH_API_KEYS=${API_AUTH_KEYS:?API_AUTH_KEYS must be set}
      - ORIO_RATE_LIMIT_ENABLED=true
      - ORIO_LLM_ENABLED=${LLM_ENABLED:-false}
      - ORIO_LLM_BASE_URL=${LLM_BASE_URL:-}
      - ORIO_LLM_API_KEY=${LLM_API_KEY:-}
      - ORIO_LLM_MODEL=${LLM_MODEL:-}
      - ORIO_CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 1G

# No top-level volumes: bind mounts to host paths are declared per service.
