services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|REPLACE_SEARXNG_SECRET|$$SEARXNG_SECRET|g" /tmp/settings.template.yml > /etc/searxng/settings.yml &&
        chown searxng:searxng /etc/searxng/settings.yml &&
        exec /usr/local/searxng/entrypoint.sh
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./searxng/settings.prod.yml:/tmp/settings.template.yml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 384M

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - meili_data:/meili_data
    expose:
      - "7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    image: ${ORIO_IMAGE:-ghcr.io/yourname/orio-search:latest}
    build: .
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_API_8000
      - ORIO_SEARCH_CONFIG=/app/config.yaml
      - ORIO_SEARXNG_URL=http://searxng:8080
      - ORIO_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ORIO_MEILI_URL=http://meilisearch:7700
      - ORIO_MEILI_API_KEY=${MEILI_MASTER_KEY}
      - ORIO_MEILI_ENABLED=true
      - ORIO_AUTH_API_KEYS=${API_AUTH_KEYS:?API_AUTH_KEYS must be set}
      - ORIO_RATE_LIMIT_ENABLED=true
      - ORIO_LLM_ENABLED=${LLM_ENABLED:-false}
      - ORIO_LLM_BASE_URL=${LLM_BASE_URL:-}
      - ORIO_LLM_API_KEY=${LLM_API_KEY:-}
      - ORIO_LLM_MODEL=${LLM_MODEL:-}
      - ORIO_CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  # Plain named volumes by default — Coolify creates them under its managed
  # data dir (typically on the host's root disk).
  #
  # To put data on a separately mounted disk, use Coolify's "Persistent
  # Storage" UI tab on the service:
  #   - Mount path in container: /data       (for redis)  or  /meili_data  (for meili)
  #   - Source path on host:     /mnt/yourdisk/orio/redis  or  .../meili
  #   - Type: directory
  #
  # This is more reliable than compose-level ${VAR} substitution in
  # driver_opts, which Coolify does not handle consistently.
  redis_data:
  meili_data:
